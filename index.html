        const getFallbackImage = (name) => {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect fill="#e4e4e7" width="300" height="300"/><text fill="#71717a" font-family="sans-serif" font-size="20" font-weight="bold" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">${name}</text></svg>`;

        const QRCodeCanvas = ({ text, width = 150, height = 150 }) => {
            const qrRef = useRef(null);
            useEffect(() => {
                if (qrRef.current && text) {
                    qrRef.current.innerHTML = '';
                    new QRCode(qrRef.current, {
                        text: text,
                        width: width,
                        height: height,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }
            }, [text, width, height]);
            return <div ref={qrRef} className="flex items-center justify-center"></div>;
        };

        function calculateCRC16(str) {
            let crc = 0xFFFF;
            for (let c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (let i = 0; i < 8; i++) {
                    if (crc & 0x8000) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            let hex = (crc & 0xFFFF).toString(16).toUpperCase();
            while (hex.length < 4) hex = '0' + hex;
            return hex;
        }

        function generateDynamicQris(staticQrisString, amount) {
            if (!staticQrisString || typeof staticQrisString !== 'string') return '';
            let qris = staticQrisString.trim();
            if (qris.length < 10) return qris;

            if (qris.endsWith('6304') && qris.length >= 4) {
                qris = qris.slice(0, -4);
            } else {
                const idx63 = qris.lastIndexOf('6304');
                if (idx63 !== -1) {
                    qris = qris.slice(0, idx63);
                }
            }

            if (qris.includes('010211')) {
                qris = qris.replace('010211', '010212');
            } else if (!qris.includes('010212')) {
                qris = '000201010212' + qris.replace('000201', '');
            }

            let cleanQris = '';
            let i = 0;
            while (i < qris.length) {
                const tag = qris.slice(i, i + 2);
                const lenStr = qris.slice(i + 2, i + 4);
                const len = parseInt(lenStr, 10);
                if (isNaN(len)) {
                    cleanQris += qris.slice(i);
                    break;
                }
                const value = qris.slice(i + 4, i + 4 + len);
                if (tag !== '54') {
                    cleanQris += tag + lenStr + value;
                }
                i += 4 + len;
            }

            const amountStr = Math.round(amount).toString();
            const tag54Val = '54' + (amountStr.length < 10 ? '0' + amountStr.length : amountStr.length) + amountStr;

            const idx58 = cleanQris.indexOf('5802ID');
            const idx59 = cleanQris.indexOf('59');
            if (idx58 !== -1) {
                cleanQris = cleanQris.slice(0, idx58) + tag54Val + cleanQris.slice(idx58);
            } else if (idx59 !== -1) {
                cleanQris = cleanQris.slice(0, idx59) + tag54Val + cleanQris.slice(idx59);
            } else {
                cleanQris += tag54Val;
            }

            cleanQris += '6304';
            const crcVal = calculateCRC16(cleanQris);
            return cleanQris + crcVal;
        }

        function App() {
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [view, setView] = useState('landing');
            const [adminTab, setAdminTab] = useState('pos');
            const [currentUser, setCurrentUser] = useState(null); 
            
            const [settings, setSettings] = useState(DEFAULT_SETTINGS);
            const [paymentMethods, setPaymentMethods] = useState(DEFAULT_PAYMENT_METHODS);
            const [menuItems, setMenuItems] = useState(DEFAULT_MENU);
            const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
            const [orders, setOrders] = useState([]);
            const [staffUsers, setStaffUsers] = useState(DEFAULT_USERS);
            const [tables, setTables] = useState([
                { id: 'T1', name: 'Meja 1', link: window.location.origin + window.location.pathname + '?table=1' },
                { id: 'T2', name: 'Meja 2', link: window.location.origin + window.location.pathname + '?table=2' }
            ]);

            const [loginForm, setLoginForm] = useState({ username: '', pin: '' });
            const [customerTable, setCustomerTable] = useState('');
            const [customerOrderType, setCustomerOrderType] = useState('dine-in');
            const [customerCart, setCustomerCart] = useState([]);
            const [customerActiveCat, setCustomerActiveCat] = useState('Semua');
            const [showCart, setShowCart] = useState(false);
            const [checkoutData, setCheckoutData] = useState({ paymentMethod: '', notes: '' });
            const [activeOrder, setActiveOrder] = useState(null);

            const [posCart, setPosCart] = useState([]);
            const [posActiveCat, setPosActiveCat] = useState('Semua');
            const [posTableNo, setPosTableNo] = useState('');
            const [posPaymentMethod, setPosPaymentMethod] = useState('');
            const [posOrderType, setPosOrderType] = useState('dine-in');
            const [posCashGiven, setPosCashGiven] = useState('');

            const [receiptOrder, setReceiptOrder] = useState(null);

            const [showMenuModal, setShowMenuModal] = useState(false);
            const [editingMenu, setEditingMenu] = useState(null);
            const [menuForm, setMenuForm] = useState({ name: '', price: '', category: 'Makanan Utama', image: '', description: '' });

            const [showStaffModal, setShowStaffModal] = useState(false);
            const [editingStaff, setEditingStaff] = useState(null);
            const [staffForm, setStaffForm] = useState({ username: '', pin: '', name: '', role: 'cashier' });

            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [editingPayment, setEditingPayment] = useState(null);
            const [paymentForm, setPaymentForm] = useState({ name: '', type: 'transfer', isActive: true, instructions: '' });

            const [showCategoryModal, setShowCategoryModal] = useState(false);
            const [categoryForm, setCategoryForm] = useState({ name: '' });
            const [tableTheme, setTableTheme] = useState('classic');

            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

            const showCustomAlert = (title, message, onConfirm = null) => {
                setModalConfig({ isOpen: true, title, message, onConfirm });
            };

            const closeCustomAlert = () => {
                setModalConfig({ isOpen: false, title: '', message: '', onConfirm: null });
            };

            useEffect(() => {
                const handleOffline = () => setIsOffline(true);
                const handleOnline = () => setIsOffline(false);
                window.addEventListener('offline', handleOffline);
                window.addEventListener('online', handleOnline);

                const sSettings = localStorage.getItem('qrResto_settings');
                if (sSettings) setSettings(JSON.parse(sSettings));
                
                const sPayments = localStorage.getItem('qrResto_payments');
                if (sPayments) setPaymentMethods(JSON.parse(sPayments));

                const sMenu = localStorage.getItem('qrResto_menu');
                if (sMenu) setMenuItems(JSON.parse(sMenu));

                const sOrders = localStorage.getItem('qrResto_orders');
                if (sOrders) setOrders(JSON.parse(sOrders));

                const sTables = localStorage.getItem('qrResto_tables');
                if (sTables) setTables(JSON.parse(sTables));

                const sStaff = localStorage.getItem('qrResto_staff');
                if (sStaff) setStaffUsers(JSON.parse(sStaff));

                const urlParams = new URLSearchParams(window.location.search);
                const tableParam = urlParams.get('table');
                if (tableParam) {
                    setCustomerTable(tableParam);
                    setView('customer');
                    window.history.pushState({}, '', window.location.pathname);
                }

                return () => {
                    window.removeEventListener('offline', handleOffline);
                    window.removeEventListener('online', handleOnline);
                };
            }, []);

            useEffect(() => { localStorage.setItem('qrResto_settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('qrResto_payments', JSON.stringify(paymentMethods)); }, [paymentMethods]);
            useEffect(() => { localStorage.setItem('qrResto_menu', JSON.stringify(menuItems)); }, [menuItems]);
            useEffect(() => { localStorage.setItem('qrResto_orders', JSON.stringify(orders)); }, [orders]);
            useEffect(() => { localStorage.setItem('qrResto_tables', JSON.stringify(tables)); }, [tables]);
            useEffect(() => { localStorage.setItem('qrResto_staff', JSON.stringify(staffUsers)); }, [staffUsers]);

            useEffect(() => {
                if (settings.appBackground) {
                    const bg = settings.appBackground.trim();
                    if (bg.startsWith('http') || bg.startsWith('data:image')) {
                        document.body.style.backgroundImage = `url('${bg}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                        document.body.style.backgroundAttachment = 'fixed';
                        document.body.style.backgroundColor = '#f4f4f5';
                    } else {
                        document.body.style.backgroundColor = bg || '#f4f4f5';
                        document.body.style.backgroundImage = 'none';
                    }
                }
            }, [settings.appBackground]);

            const generateOrderId = () => `ORD-${Math.floor(1000 + Math.random() * 9000)}`;
            const calculateSubtotal = (cart) => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const calculateTax = (subtotal) => subtotal * (settings.taxRate / 100);
            const calculateService = (subtotal) => subtotal * (settings.serviceCharge / 100);
            const calculateTotal = (cart) => {
                const sub = calculateSubtotal(cart);
                return sub + calculateTax(sub) + calculateService(sub);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                const found = staffUsers.find(u => u.username === loginForm.username && u.pin === loginForm.pin);

                    setCurrentUser(found);
                    setView('admin');
                    setAdminTab('pos');
                    setLoginForm({ username: '', pin: '' });
                } else {
                    showCustomAlert('Gagal Masuk', 'Username atau PIN salah. Silakan coba lagi.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('landing');
            };

            const handleCustomerLogin = (e) => {
                e.preventDefault();
                if (customerTable.trim() || customerOrderType === 'takeaway') setView('customer');
            };

            const addToCustomerCart = (item) => {
                setCustomerCart(prev => {
                    const exists = prev.find(i => i.id === item.id);
                    if (exists) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                    return [...prev, { ...item, quantity: 1 }];
                });
            };

            const updateCustomerQuantity = (id, delta) => {
                setCustomerCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const handleCustomerCheckout = () => {
                if (!checkoutData.paymentMethod || customerCart.length === 0) return;
                
                const newOrder = {
                    id: generateOrderId(),
                    table: customerOrderType === 'takeaway' ? 'Takeaway' : customerTable,
                    orderType: customerOrderType,
                    items: [...customerCart],
                    subtotal: calculateSubtotal(customerCart),
                    tax: calculateTax(calculateSubtotal(customerCart)),
                    service: calculateService(calculateSubtotal(customerCart)),
                    total: calculateTotal(customerCart),
                    paymentMethod: checkoutData.paymentMethod,
                    notes: checkoutData.notes,
                    status: 'unverified', 
                    time: new Date().toISOString(),
                    source: 'QR',
                    cashGiven: 0,
                    changeAmount: 0
                };
                setOrders([newOrder, ...orders]);
                setActiveOrder(newOrder);
                setReceiptOrder(newOrder); 
                setCustomerCart([]);
                setShowCart(false);
            };

            const addToPosCart = (item) => {
                setPosCart(prev => {
                    const exists = prev.find(i => i.id === item.id);
                    if (exists) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                    return [...prev, { ...item, quantity: 1 }];
                });
            };

            const updatePosQuantity = (id, delta) => {
                setPosCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const handlePosCheckout = () => {
                if (!posPaymentMethod || posCart.length === 0) return;
                const totalAmt = calculateTotal(posCart);
                const selectedPm = paymentMethods.find(p => p.id === posPaymentMethod);
                const isCash = selectedPm?.type === 'cash';

                let cashGivenNum = 0;
                let changeNum = 0;

                if (isCash) {
                    cashGivenNum = parseFloat(posCashGiven.replace(/[^0-9.]/g, '')) || 0;
                    if (cashGivenNum < totalAmt) {
                        showCustomAlert('Pembayaran Kurang', 'Jumlah uang tunai yang diterima kurang dari total tagihan.');
                        return;
                    }
                    changeNum = cashGivenNum - totalAmt;
                }

                const newOrder = {
                    id: generateOrderId(),
                    table: posTableNo || 'Takeaway',
                    orderType: posOrderType,
                    items: [...posCart],
                    subtotal: calculateSubtotal(posCart),
                    tax: calculateTax(calculateSubtotal(posCart)),
                    service: calculateService(calculateSubtotal(posCart)),
                    total: totalAmt,
                    paymentMethod: posPaymentMethod,
                    notes: '',
                    status: 'completed',
                    time: new Date().toISOString(),
                    source: 'KASIR',
                    cashGiven: isCash ? cashGivenNum : 0,
                    changeAmount: isCash ? changeNum : 0
                };
                setOrders([newOrder, ...orders]);
                setPosCart([]);
                setPosTableNo('');
                setPosPaymentMethod('');
                setPosCashGiven('');
                setReceiptOrder(newOrder);
            };

            const saveMenu = (e) => {
                e.preventDefault();
                if (editingMenu) {
                    setMenuItems(menuItems.map(m => m.id === editingMenu.id ? { ...menuForm, id: m.id, price: Number(menuForm.price) } : m));
                } else {
                    setMenuItems([...menuItems, { ...menuForm, id: Date.now(), price: Number(menuForm.price) }]);
                }
                setShowMenuModal(false);
            };

            const deleteMenu = (id) => {

                    setMenuItems(menuItems.filter(m => m.id !== id));
                });
            };

            const openMenuModal = (menu = null) => {
                if (menu) {
                    setEditingMenu(menu);
                    setMenuForm(menu);
                } else {
                    setEditingMenu(null);
                    setMenuForm({ name: '', price: '', category: 'Makanan Utama', image: '', description: '' });
                }
                setShowMenuModal(true);
            };

                e.preventDefault();
                if (editingStaff) {
                    setStaffUsers(staffUsers.map(s => s.id === editingStaff.id ? { ...staffForm, id: s.id } : s));
                } else {
                    setStaffUsers([...staffUsers, { ...staffForm, id: Date.now() }]);

                setShowStaffModal(false);
            };

                    setStaffForm(staff);

                }
                setShowStaffModal(true);

                    setPaymentMethods([...paymentMethods, { id: newId, ...paymentForm }]);
                }

            };

                    setPaymentForm(pm);
                } else {
                    setEditingPayment(null);
                    setPaymentForm({ name: '', type: 'transfer', isActive: true, instructions: '' });
                }
                setShowPaymentModal(true);

                const newCatId = categoryForm.name.trim();
                if (categories.some(c => c.id === newCatId)) {
                    showCustomAlert('Peringatan', 'Kategori ini sudah ada.');
                    return;

                setCategories([...categories, { id: newCatId, name: categoryForm.name.trim() }]);

                });
            };

            const getQrBase64Sync = (text, size = 150) => {
                return new Promise((resolve) => {
                    const tempDiv = document.createElement('div');
                    new QRCode(tempDiv, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    setTimeout(() => {
                        const canvas = tempDiv.querySelector('canvas');
                        resolve(canvas ? canvas.toDataURL('image/png') : '');
                    }, 50);
                });
            };

            const isCash = paymentObj?.type === 'cash';
            const isQris = paymentObj?.type === 'qris';

            if (settings.serviceCharge > 0) h += 20;
            if (isCash) h += 40;
            if (isQris) h += 220; 

            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(settings.restoName, canvas.width / 2, 30);

            ctx.font = '12px Courier New';
            ctx.fillText('Struk Pembayaran Resmi', canvas.width / 2, 50);

            ctx.textAlign = 'left';
            ctx.font = '12px Courier New';
            let y = 80;
            ctx.fillText(`ID Pesanan : ${order.id}`, 20, y); y += 20;
            ctx.fillText(`Waktu      : ${new Date(order.time).toLocaleString('id-ID')}`, 20, y); y += 20;
            ctx.fillText(`Meja/Tipe  : ${order.table} (${order.orderType})`, 20, y); y += 25;

            ctx.beginPath();
            ctx.setLineDash([4, 2]);
            ctx.moveTo(20, y); ctx.lineTo(380, y);
            ctx.stroke();
            ctx.setLineDash([]);
            y += 20;

            order.items.forEach(i => {
                ctx.fillText(`${i.quantity}x ${i.name}`, 20, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${(i.price * i.quantity).toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
                ctx.textAlign = 'left';
                y += 20;
            });

            ctx.beginPath();
            ctx.setLineDash([4, 2]);
            ctx.moveTo(20, y); ctx.lineTo(380, y);
            ctx.stroke();
            ctx.setLineDash([]);
            y += 20;

            ctx.fillText(`Subtotal`, 20, y);
            ctx.textAlign = 'right';
            ctx.fillText(`Rp ${order.subtotal.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
            ctx.textAlign = 'left';
            y += 20;

            if(settings.taxRate > 0) {
                ctx.fillText(`Pajak (${settings.taxRate}%)`, 20, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${order.tax.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
                ctx.textAlign = 'left';
                y += 20;
            }

            if(settings.serviceCharge > 0) {
                ctx.fillText(`Service (${settings.serviceCharge}%)`, 20, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${order.service.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
                ctx.textAlign = 'left';
                y += 20;
            }

            ctx.beginPath();
            ctx.setLineDash([4, 2]);
            ctx.moveTo(20, y); ctx.lineTo(380, y);
            ctx.stroke();
            ctx.setLineDash([]);
            y += 25;

            ctx.font = 'bold 14px Courier New';
            ctx.fillText(`TOTAL`, 20, y);
            ctx.textAlign = 'right';
            ctx.fillText(`Rp ${order.total.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
            ctx.textAlign = 'left';
            y += 25;

            if (isCash) {
                ctx.font = '12px Courier New';
                ctx.fillText(`Tunai Diterima`, 20, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${(order.cashGiven || 0).toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
                ctx.textAlign = 'left';
                y += 20;

                ctx.fillText(`Kembalian`, 20, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${(order.changeAmount || 0).toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 380, y);
                ctx.textAlign = 'left';
                y += 25;
            }

            const finishDownload = () => {
                ctx.font = '12px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('Terima Kasih Atas Kunjungan Anda!', canvas.width / 2, y);

                const dataUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `Struk-${order.id}.png`;
                a.click();

            if (isQris) {
                const dynQris = generateDynamicQris(settings.staticQris, Math.round(order.total));
                const qrDataUrl = await getQrBase64Sync(dynQris, 150);
                const img = new Image();
                img.onload = () => {
                    ctx.beginPath();
                    ctx.setLineDash([4, 2]);
                    ctx.moveTo(20, y); ctx.lineTo(380, y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    y += 25;
                    
                    ctx.font = 'bold 14px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('QRIS PEMBAYARAN', canvas.width / 2, y);
                    y += 15;

                    ctx.drawImage(img, (canvas.width - 150) / 2, y, 150, 150);
                    y += 170;
                    finishDownload();
                };
                img.src = qrDataUrl;
            } else {
                finishDownload();
            }
        };

        const handleBackup = () => {
                const data = { settings, paymentMethods, menuItems, orders, tables, staffUsers };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup-RestoQR-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            const handleRestore = (e) => {

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.settings) setSettings(data.settings);
                        if (data.paymentMethods) setPaymentMethods(data.paymentMethods);
                        if (data.menuItems) setMenuItems(data.menuItems);
                        if (data.orders) setOrders(data.orders);
                        if (data.tables) setTables(data.tables);
                        if (data.staffUsers) setStaffUsers(data.staffUsers);
                        showCustomAlert('Restore Berhasil', 'Data sistem berhasil dipulihkan dari file backup.');
                    } catch (error) {
                        showCustomAlert('Restore Gagal', 'Format file backup tidak valid atau rusak.');

                    e.target.value = '';

                reader.readAsText(file);

                                                                    <textarea rows="3" placeholder="Contoh: Transfer ke nomor e-wallet 08123456789 a.n. Resto" value={paymentForm.instructions || ''} onChange={e => setPaymentForm({...paymentForm, instructions: e.target.value})} className="w-full mt-1 p-3 rounded-xl border border-zinc-300 focus:border-brand-500 outline-none text-xs font-medium"></textarea>
                                                                </div>
                                                                <div className="flex items-center justify-between p-3 bg-zinc-50 rounded-xl border border-zinc-200">
                                                                    <span className="text-sm font-bold text-zinc-700">Aktifkan Metode Ini</span>
                                                                    <label className="relative inline-flex items-center cursor-pointer">
                                                                        <input type="checkbox" className="sr-only peer" checked={paymentForm.isActive} onChange={e => setPaymentForm({...paymentForm, isActive: e.target.checked})} />
                                                                        <div className="w-11 h-6 bg-zinc-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-600"></div>
                                                                    </label>
                                                                </div>
                                                                <button type="submit" className="w-full bg-brand-600 text-white font-bold py-3 rounded-xl hover:bg-brand-700 mt-2 shadow-md">Simpan Metode Pembayaran</button>
                                                            </form>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-zinc-200">
                                                    <div className="flex justify-between items-center mb-4 border-b border-zinc-100 pb-2">
                                                        <h3 className="font-black text-lg text-zinc-800">Manajemen Data (Backup)</h3>
                                                    </div>
                                                    <div className="space-y-4">
                                                        <div className="grid grid-cols-2 gap-3">
                                                            <button onClick={handleBackup} className="flex flex-col items-center justify-center p-4 bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-xl border border-brand-200 transition-colors">
                                                                <svg className="w-6 h-6 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                                            <span className="font-bold text-sm">Download Backup</span>
                                                            </button>
                                                            <label className="flex flex-col items-center justify-center p-4 bg-zinc-50 hover:bg-zinc-100 text-zinc-700 rounded-xl border border-zinc-200 transition-colors cursor-pointer">
                                                                <svg className="w-6 h-6 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4 4m0 0l-4-4m4 4V4" /></svg>
                                                                <span className="font-bold text-sm">Restore Data</span>
                                                                <input type="file" accept=".json" onChange={handleRestore} className="hidden" />
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </main>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
