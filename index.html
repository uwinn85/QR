                        instructions: doc.data().instructions || ''

                    const normalizeMenu = (doc) => {
                        const item = doc.data();
                        return {
                            id: doc.id,
                            name: item.name,
                            price: Number(item.price || 0),
                            category: item.category || item.categoryId || 'Makanan Utama',
                            image: item.imageUrl || item.image || '',
                            description: item.description || '',
                            quantity: item.quantity || 1
                        };
                    };

                    const normalizeOrder = (doc) => {
                        const item = doc.data();
                        return {
                            id: doc.id || item.orderId,
                            ...item,
                            table: item.table || 'Takeaway',
                            paymentMethod: item.paymentMethod || 'cash',
                            status: item.status || 'unverified',
                            time: item.time || item.createdAt?.toDate?.()?.toISOString?.() || new Date().toISOString(),
                            source: item.source || 'QR',
                            items: Array.isArray(item.items) ? item.items.map((entry) => ({
                                ...entry,
                                id: entry.id || entry.itemId || Date.now() + Math.random(),
                                quantity: entry.quantity || entry.qty || 1,
                                price: Number(entry.price || entry.unitPrice || 0)
                            })) : [],
                            subtotal: Number(item.subtotal || 0),
                            tax: Number(item.tax || 0),
                            service: Number(item.service || 0),
                            total: Number(item.total || 0),
                            cashGiven: Number(item.cashGiven || 0),
                            changeAmount: Number(item.changeAmount || 0)
                        };
                    };

                    const normalizeTable = (doc) => {
                        const item = doc.data();
                        return {
                            id: doc.id,
                            name: item.name || item.code,
                            code: item.code || doc.id,
                            link: item.qrLink || `${window.location.origin}${window.location.pathname}?table=${encodeURIComponent(item.code || doc.id)}`,

                        };
                    };

                    const normalizeStaff = (doc) => {
                        const item = doc.data();
                        return {
                            id: doc.id,
                            username: item.username,
                            pin: item.pin,
                            role: item.role || 'cashier',
                            name: item.fullName || item.name || item.username,
                            fullName: item.fullName || item.name || item.username

                    const menuItemsData = menuSnap.docs.map(normalizeMenu);
                    const ordersData = ordersSnap.docs.map(normalizeOrder);
                    const tablesData = tablesSnap.docs.map(normalizeTable);
                    const staffUsersData = staffSnap.docs.map(normalizeStaff);

                        settings: settingsData,

                        menuItems: menuItemsData,
                        orders: ordersData,
                        tables: tablesData,

            async saveAllData({ settings, paymentMethods, menuItems, orders, tables, staffUsers, categories }) {
                if (!firebaseDb || !firebaseInitialized) return;
                try {
                    const restaurantRef = firebaseDb.collection('restaurants').doc(FIREBASE_RESTAURANT_ID);
                    const batch = firebaseDb.batch();

                    batch.set(restaurantRef, {
                        name: settings.restoName || 'Nusantara Resto',
                        address: settings.restoAddress || '',
                        phone: settings.restoPhone || '',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    batch.set(restaurantRef.collection('settings').doc('default'), {
                        ...settings,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    const existingPayments = await restaurantRef.collection('paymentMethods').get();
                    existingPayments.docs.forEach((docSnap) => batch.delete(docSnap.ref));
                    paymentMethods.forEach((method) => {
                        const id = method.id || method.name || `pay_${Date.now()}`;
                        batch.set(restaurantRef.collection('paymentMethods').doc(id), {
                            ...method,
                            id,
                            type: method.type || 'transfer',
                            isActive: method.isActive !== undefined ? method.isActive : true,
                            instructions: method.instructions || '',
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    const existingMenu = await restaurantRef.collection('menuItems').get();
                    existingMenu.docs.forEach((docSnap) => batch.delete(docSnap.ref));
                    menuItems.forEach((item) => {
                        const id = item.id || `menu_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                        const categoryName = item.category || 'Makanan Utama';
                        batch.set(restaurantRef.collection('menuItems').doc(id), {
                            id,
                            category: categoryName,
                            categoryId: categoryName,
                            name: item.name,
                            description: item.description || '',
                            price: Number(item.price || 0),
                            imageUrl: item.image || item.imageUrl || '',
                            image: item.image || item.imageUrl || '',
                            active: true,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    const existingTables = await restaurantRef.collection('tables').get();
                    existingTables.docs.forEach((docSnap) => batch.delete(docSnap.ref));
                    tables.forEach((table) => {
                        const id = table.id || table.code || `T${Date.now()}`;
                        batch.set(restaurantRef.collection('tables').doc(id), {
                            id,
                            code: table.code || table.name || id,
                            name: table.name || table.code || id,
                            qrLink: table.link || table.qrLink || `${window.location.origin}${window.location.pathname}?table=${encodeURIComponent(table.name || table.code || id)}`,
                            status: table.status || 'available',
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    const existingStaff = await restaurantRef.collection('staff').get();
                    existingStaff.docs.forEach((docSnap) => batch.delete(docSnap.ref));
                    staffUsers.forEach((user) => {
                        const id = user.id || user.username || `staff_${Date.now()}`;
                        batch.set(restaurantRef.collection('staff').doc(id), {
                            id,
                            username: user.username,
                            pin: user.pin,
                            role: user.role || 'cashier',
                            name: user.name || user.fullName || user.username,
                            fullName: user.fullName || user.name || user.username,
                            active: user.active !== undefined ? user.active : true,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    const existingCategories = await restaurantRef.collection('menuCategories').get();
                    existingCategories.docs.forEach((docSnap) => batch.delete(docSnap.ref));
                    categories.forEach((category, index) => {
                        const id = category.id || `cat_${index + 1}`;
                        batch.set(restaurantRef.collection('menuCategories').doc(id), {
                            id,
                            name: category.name,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    const existingOrders = await restaurantRef.collection('orders').get();
                    existingOrders.docs.forEach((docSnap) => batch.delete(docSnap.ref));
                    orders.forEach((order) => {
                        const id = order.id || order.orderId || `ORD-${Date.now()}`;
                        batch.set(restaurantRef.collection('orders').doc(id), {
                            ...order,
                            id,
                            orderId: order.orderId || id,
                            table: order.table || 'Takeaway',
                            paymentMethod: order.paymentMethod || 'cash',

                            service: Number(order.service || 0),
                            total: Number(order.total || 0),
                            cashGiven: Number(order.cashGiven || 0),
                            changeAmount: Number(order.changeAmount || 0),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    await batch.commit();
                    console.log('Firebase sync successful');
                } catch (error) {
                    console.warn('Firebase saveAllData failed:', error);
                }
            }

        function calculateCRC16(str) {
            let crc = 0xFFFF;
            for (let c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (let i = 0; i < 8; i++) {
                    if (crc & 0x8000) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            let hex = (crc & 0xFFFF).toString(16).toUpperCase();
            while (hex.length < 4) hex = '0' + hex;
            return hex;
        }

        function generateDynamicQris(staticQrisString, amount) {
            if (!staticQrisString || typeof staticQrisString !== 'string') return '';
            let qris = staticQrisString.trim();
            if (qris.length < 10) return qris;

            if (qris.endsWith('6304') && qris.length >= 4) {
                qris = qris.slice(0, -4);
            } else {
                const idx63 = qris.lastIndexOf('6304');
                if (idx63 !== -1) {
                    qris = qris.slice(0, idx63);
                }
            }

            if (qris.includes('010211')) {
                qris = qris.replace('010211', '010212');
            } else if (!qris.includes('010212')) {
                qris = '000201010212' + qris.replace('000201', '');
            }

            let cleanQris = '';
            let i = 0;
            while (i < qris.length) {
                const tag = qris.slice(i, i + 2);
                const lenStr = qris.slice(i + 2, i + 4);
                const len = parseInt(lenStr, 10);
                if (isNaN(len)) {
                    cleanQris += qris.slice(i);
                    break;
                }
                const value = qris.slice(i + 4, i + 4 + len);
                if (tag !== '54') {
                    cleanQris += tag + lenStr + value;
                }
                i += 4 + len;
            }

            const amountStr = Math.round(amount).toString();
            const tag54Val = '54' + (amountStr.length < 10 ? '0' + amountStr.length : amountStr.length) + amountStr;

            const idx58 = cleanQris.indexOf('5802ID');
            const idx59 = cleanQris.indexOf('59');
            if (idx58 !== -1) {
                cleanQris = cleanQris.slice(0, idx58) + tag54Val + cleanQris.slice(idx58);
            } else if (idx59 !== -1) {
                cleanQris = cleanQris.slice(0, idx59) + tag54Val + cleanQris.slice(idx59);
            } else {
                cleanQris += tag54Val;
            }

            cleanQris += '6304';
            const crcVal = calculateCRC16(cleanQris);
            return cleanQris + crcVal;
        }

                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = 'bold 15px Courier New';
                ctx.textAlign = 'center';

                if (settings.receiptShowPhone && settings.restoPhone) {
                    ctx.font = '10px Courier New';
                    ctx.fillText(`Telp: ${settings.restoPhone}`, canvas.width / 2, currY);
                    currY += 18;
                }

                ctx.textAlign = 'left';
                ctx.font = '11px Courier New';
                let y = currY + 8;
                ctx.fillText(`ID Pesanan : ${order.id}`, 15, y); y += 18;
                ctx.fillText(`Waktu      : ${new Date(order.time).toLocaleString('id-ID')}`, 15, y); y += 18;
                ctx.fillText(`Meja/Tipe  : ${order.table} (${order.orderType})`, 15, y); y += 22;

                ctx.beginPath();
                ctx.setLineDash([4, 2]);
                ctx.moveTo(15, y); ctx.lineTo(365, y);
                ctx.stroke();
                ctx.setLineDash([]);
                y += 18;

                order.items.forEach(i => {
                    ctx.fillText(`${i.quantity}x ${i.name}`, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(`Rp ${(i.price * i.quantity).toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                    ctx.textAlign = 'left';
                    y += 18;
                });

                ctx.beginPath();
                ctx.setLineDash([4, 2]);
                ctx.moveTo(15, y); ctx.lineTo(365, y);
                ctx.stroke();
                ctx.setLineDash([]);
                y += 18;

                ctx.fillText(`Subtotal`, 15, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${order.subtotal.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                ctx.textAlign = 'left';
                y += 18;

                if(settings.taxRate > 0) {
                    ctx.fillText(`Pajak (${settings.taxRate}%)`, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(`Rp ${order.tax.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                    ctx.textAlign = 'left';
                    y += 18;
                }

                if(settings.serviceCharge > 0) {
                    ctx.fillText(`Service (${settings.serviceCharge}%)`, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(`Rp ${order.service.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                    ctx.textAlign = 'left';
                    y += 18;
                }

                ctx.beginPath();
                ctx.setLineDash([4, 2]);
                ctx.moveTo(15, y); ctx.lineTo(365, y);
                ctx.stroke();
                ctx.setLineDash([]);
                y += 22;

                ctx.font = 'bold 13px Courier New';
                ctx.fillText(`TOTAL`, 15, y);
                ctx.textAlign = 'right';
                ctx.fillText(`Rp ${order.total.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                ctx.textAlign = 'left';
                y += 22;

                if (isCash) {
                    ctx.font = '11px Courier New';
                    ctx.fillText(`Tunai Diterima`, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(`Rp ${(order.cashGiven || 0).toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                    ctx.textAlign = 'left';
                    y += 18;

                    ctx.fillText(`Kembalian`, 15, y);
                    ctx.textAlign = 'right';
                    ctx.fillText(`Rp ${(order.changeAmount || 0).toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`, 365, y);
                    ctx.textAlign = 'left';
                    y += 22;
                }

                const finishDownload = () => {
                    ctx.font = '11px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText(settings.receiptFooterNote || 'Terima Kasih Atas Kunjungan Anda!', canvas.width / 2, y);

                    const dataUrl = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = `Struk-${order.id}.png`;
                    a.click();
                };

                if (isQris) {
                    const dynQris = generateDynamicQris(settings.staticQris, Math.round(order.total));
                    const qrDataUrl = await getQrBase64Sync(dynQris, 140);
                    const img = new Image();
                    img.onload = () => {
                        ctx.beginPath();
                        ctx.setLineDash([4, 2]);
                        ctx.moveTo(15, y); ctx.lineTo(365, y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        y += 22;
                        
                        ctx.font = 'bold 13px Courier New';
                        ctx.textAlign = 'center';
                        ctx.fillText('QRIS PEMBAYARAN', canvas.width / 2, y);
                        y += 14;

                        ctx.drawImage(img, (canvas.width - 130) / 2, y, 130, 130);
                        y += 150;
                        finishDownload();
                    };
                    img.src = qrDataUrl;
                } else {
                    finishDownload();
                }
            };

            const handleBackup = () => {
                const data = { settings, paymentMethods, menuItems, orders, tables, staffUsers };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup-RestoQR-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.settings) setSettings(data.settings);
                        if (data.paymentMethods) setPaymentMethods(data.paymentMethods);
                        if (data.menuItems) setMenuItems(data.menuItems);
                        if (data.orders) setOrders(data.orders);
                        if (data.tables) setTables(data.tables);
                        if (data.staffUsers) setStaffUsers(data.staffUsers);
                        showCustomAlert('Restore Berhasil', 'Data sistem berhasil dipulihkan dari file backup.');
                    } catch (error) {
                        showCustomAlert('Restore Gagal', 'Format file backup tidak valid atau rusak.');

                    e.target.value = ''; 
                };
                reader.readAsText(file);
            };

                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-1">Tipe Pesanan</label>
                                                <select value={posOrderType} onChange={(e) => setPosOrderType(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs">
                                                    <option value="dine-in">Dine In</option>
                                                    <option value="takeaway">Takeaway</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-1">Metode Pembayaran</label>
                                                <select value={posPaymentMethod} onChange={(e) => setPosPaymentMethod(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs">
                                                    <option value="">Pilih</option>
                                                    {paymentMethods.map((pm) => (
                                                        <option key={pm.id} value={pm.id}>{pm.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            {paymentMethods.find(p => p.id === posPaymentMethod)?.type === 'cash' && (
                                                <div>
                                                    <label className="block text-xs font-medium text-slate-700 mb-1">Uang Tunai</label>
                                                    <input value={posCashGiven} onChange={(e) => setPosCashGiven(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" placeholder="Masukkan nominal" />
                                                </div>
                                            )}
                                            <div className="border-t border-slate-200 pt-3 space-y-2">
                                                <div className="flex justify-between text-xs text-slate-600"><span>Subtotal</span><span>Rp {calculateSubtotal(posCart).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between text-xs text-slate-600"><span>Pajak ({settings.taxRate}%)</span><span>Rp {calculateTax(calculateSubtotal(posCart)).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between text-xs text-slate-600"><span>Service ({settings.serviceCharge}%)</span><span>Rp {calculateService(calculateSubtotal(posCart)).toLocaleString('id-ID')}</span></div>
                                                <div className="flex justify-between font-bold text-slate-800"><span>Total</span><span>Rp {calculateTotal(posCart).toLocaleString('id-ID')}</span></div>
                                            </div>
                                            <button onClick={handlePosCheckout} disabled={posCart.length === 0 || !posPaymentMethod} className={`w-full py-3 rounded-xl font-bold ${posCart.length === 0 || !posPaymentMethod ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'bg-brand-600 text-white hover:bg-brand-700'}`}>
                                                Bayar Sekarang
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {adminTab === 'menu' && (
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-bold text-slate-800">Manajemen Menu</h3>
                                        <button onClick={() => openMenuModal()} className="px-3 py-2 rounded-xl bg-brand-600 text-white font-semibold">Tambah Menu</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                        {menuItems.map((item) => (
                                            <div key={item.id} className="border border-slate-200 rounded-2xl overflow-hidden">
                                                <img src={item.image || item.imageUrl || getFallbackImage(item.name)} alt={item.name} className="h-32 w-full object-cover" />
                                                <div className="p-3">
                                                    <div className="flex justify-between gap-2 mb-2">
                                                        <h4 className="font-bold text-slate-800 text-sm">{item.name}</h4>
                                                        <span className="text-brand-700 font-bold text-xs">Rp {Number(item.price || 0).toLocaleString('id-ID')}</span>
                                                    </div>
                                                    <p className="text-xs text-slate-600 mb-2">{item.category}</p>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => openMenuModal(item)} className="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold">Edit</button>
                                                        <button onClick={() => deleteMenu(item.id)} className="flex-1 py-2 rounded-xl bg-red-100 text-red-700 font-semibold">Hapus</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {adminTab === 'staff' && (
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-bold text-slate-800">Manajemen Staff</h3>
                                        <button onClick={() => openStaffModal()} className="px-3 py-2 rounded-xl bg-brand-600 text-white font-semibold">Tambah Staff</button>
                                    </div>
                                    <div className="space-y-3">
                                        {staffUsers.map((user) => (
                                            <div key={user.id} className="flex items-center justify-between p-3 border border-slate-200 rounded-xl">
                                                <div>
                                                    <p className="font-bold text-slate-800">{user.name || user.fullName || user.username}</p>
                                                    <p className="text-xs text-slate-500">{user.username} • {user.role}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => openStaffModal(user)} className="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold">Edit</button>
                                                    <button onClick={() => deleteStaff(user.id)} className="px-3 py-2 rounded-xl bg-red-100 text-red-700 font-semibold">Hapus</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {adminTab === 'payment' && (
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-bold text-slate-800">Metode Pembayaran</h3>
                                        <button onClick={() => openPaymentModal()} className="px-3 py-2 rounded-xl bg-brand-600 text-white font-semibold">Tambah</button>
                                    </div>
                                    <div className="space-y-3">
                                        {paymentMethods.map((pm) => (
                                            <div key={pm.id} className="p-3 border border-slate-200 rounded-xl">
                                                <div className="flex items-center justify-between gap-3">
                                                    <div>
                                                        <p className="font-bold text-slate-800">{pm.name}</p>
                                                        <p className="text-xs text-slate-500">{pm.type}</p>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => openPaymentModal(pm)} className="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold">Edit</button>
                                                        <button onClick={() => deletePayment(pm.id)} className="px-3 py-2 rounded-xl bg-red-100 text-red-700 font-semibold">Hapus</button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {adminTab === 'tables' && (
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-bold text-slate-800">Manajemen Meja</h3>
                                        <button onClick={addTable} className="px-3 py-2 rounded-xl bg-brand-600 text-white font-semibold">Tambah Meja</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                        {tables.map((table) => (
                                            <div key={table.id} className="border border-slate-200 rounded-2xl p-4">
                                                <div className="flex items-center justify-between mb-3">
                                                    <h4 className="font-bold text-slate-800">{table.name || table.code}</h4>
                                                    <span className="px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold">{table.status || 'available'}</span>
                                                </div>
                                                <p className="text-xs text-slate-500 break-all mb-3">{table.link || `?table=${table.code}`}</p>
                                                <button onClick={() => printQR(table)} className="w-full py-2 rounded-xl bg-slate-900 text-white font-semibold">Print QR</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {adminTab === 'category' && (
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="text-lg font-bold text-slate-800">Kategori Menu</h3>
                                        <button onClick={() => setShowCategoryModal(true)} className="px-3 py-2 rounded-xl bg-brand-600 text-white font-semibold">Tambah Kategori</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {categories.map((cat) => (
                                            <div key={cat.id} className="flex items-center gap-2 border border-slate-200 rounded-full px-3 py-2">
                                                <span className="font-medium text-slate-700">{cat.name}</span>
                                                {cat.id !== 'Semua' && (
                                                    <button onClick={() => deleteCategory(cat.id)} className="text-red-600 font-bold">×</button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {adminTab === 'settings' && (
                                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">Pengaturan Aplikasi</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Nama Restoran</label>
                                            <input value={settings.restoName} onChange={(e) => setSettings({ ...settings, restoName: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Alamat</label>
                                            <input value={settings.restoAddress} onChange={(e) => setSettings({ ...settings, restoAddress: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Telepon</label>
                                            <input value={settings.restoPhone} onChange={(e) => setSettings({ ...settings, restoPhone: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Pajak (%)</label>
                                            <input type="number" value={settings.taxRate} onChange={(e) => setSettings({ ...settings, taxRate: Number(e.target.value) })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Service Charge (%)</label>
                                            <input type="number" value={settings.serviceCharge} onChange={(e) => setSettings({ ...settings, serviceCharge: Number(e.target.value) })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Background</label>
                                            <input value={settings.appBackground} onChange={(e) => setSettings({ ...settings, appBackground: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                    </div>
                                    <div className="mt-5 flex gap-2">
                                        <button onClick={handleBackup} className="px-4 py-2 rounded-xl bg-slate-900 text-white font-semibold">Backup</button>
                                        <label className="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-semibold cursor-pointer">
                                            Restore
                                            <input type="file" className="hidden" onChange={handleRestore} />
                                        </label>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {showMenuModal && (
                        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-xl p-5">
                                <h3 className="text-xl font-bold text-slate-800 mb-4">{editingMenu ? 'Edit Menu' : 'Tambah Menu'}</h3>
                                <form onSubmit={saveMenu} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Nama Menu</label>
                                        <input value={menuForm.name} onChange={(e) => setMenuForm({ ...menuForm, name: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Harga</label>
                                            <input type="number" value={menuForm.price} onChange={(e) => setMenuForm({ ...menuForm, price: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Kategori</label>
                                            <select value={menuForm.category} onChange={(e) => setMenuForm({ ...menuForm, category: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs">
                                                {categories.filter(c => c.id !== 'Semua').map((cat) => (
                                                    <option key={cat.id} value={cat.id}>{cat.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">URL Gambar</label>
                                        <input value={menuForm.image} onChange={(e) => setMenuForm({ ...menuForm, image: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Deskripsi</label>
                                        <textarea value={menuForm.description} onChange={(e) => setMenuForm({ ...menuForm, description: e.target.value })} className="w-full h-24 px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none resize-none text-xs" />
                                    </div>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowMenuModal(false)} className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 font-semibold">Batal</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl bg-brand-600 text-white font-semibold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showStaffModal && (
                        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md p-5">
                                <h3 className="text-xl font-bold text-slate-800 mb-4">{editingStaff ? 'Edit Staff' : 'Tambah Staff'}</h3>
                                <form onSubmit={saveStaff} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Username</label>
                                        <input value={staffForm.username} onChange={(e) => setStaffForm({ ...staffForm, username: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">PIN</label>
                                        <input type="password" value={staffForm.pin} onChange={(e) => setStaffForm({ ...staffForm, pin: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Nama</label>
                                        <input value={staffForm.name} onChange={(e) => setStaffForm({ ...staffForm, name: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Role</label>
                                        <select value={staffForm.role} onChange={(e) => setStaffForm({ ...staffForm, role: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs">
                                            <option value="cashier">Cashier</option>
                                            <option value="admin">Admin</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowStaffModal(false)} className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 font-semibold">Batal</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl bg-brand-600 text-white font-semibold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showPaymentModal && (
                        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md p-5">
                                <h3 className="text-xl font-bold text-slate-800 mb-4">{editingPayment ? 'Edit Metode Pembayaran' : 'Tambah Metode Pembayaran'}</h3>
                                <form onSubmit={savePayment} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Nama</label>
                                        <input value={paymentForm.name} onChange={(e) => setPaymentForm({ ...paymentForm, name: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Tipe</label>
                                        <select value={paymentForm.type} onChange={(e) => setPaymentForm({ ...paymentForm, type: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs">
                                            <option value="qris">QRIS</option>
                                            <option value="ewallet">E-Wallet</option>
                                            <option value="transfer">Transfer</option>
                                            <option value="cash">Tunai</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Instruksi</label>
                                        <textarea value={paymentForm.instructions} onChange={(e) => setPaymentForm({ ...paymentForm, instructions: e.target.value })} className="w-full h-24 px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none resize-none text-xs" />
                                    </div>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowPaymentModal(false)} className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 font-semibold">Batal</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl bg-brand-600 text-white font-semibold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showCategoryModal && (
                        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md p-5">
                                <h3 className="text-xl font-bold text-slate-800 mb-4">Tambah Kategori</h3>
                                <form onSubmit={addCategory} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Nama Kategori</label>
                                        <input value={categoryForm.name} onChange={(e) => setCategoryForm({ name: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none text-xs" />
                                    </div>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowCategoryModal(false)} className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 font-semibold">Batal</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl bg-brand-600 text-white font-semibold">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
