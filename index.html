        // DATABASE LAYER (IndexedDB)
        // ==========================================
        const DB_NAME = 'RestoQR_DB_v4';
        const DB_VERSION = 1;
        const STORE_NAME = 'app_data';
        
        const SYNC_CHANNEL = typeof BroadcastChannel !== 'undefined'
            ? new BroadcastChannel('resto_qr_db_sync_channel_v4')
            : null;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => {
                    const db = request.result;
                    db.onversionchange = () => db.close();
                    resolve(db);
                };
                request.onerror = () => reject(request.error);
            });
        };

        const dbGet = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                    tx.oncomplete = () => db.close();
                    tx.onerror = () => { db.close(); reject(tx.error || req.error); };
                    tx.onabort = () => { db.close(); reject(tx.error || new Error('Transaksi database dibatalkan')); };
                });
            } catch (error) {
                console.error("DB Get Error:", error);
                return null;
            }
        };

        const dbSet = async (key, value, broadcast = false) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.put(value, key);
                    req.onsuccess = () => {
                        // Wait for transaction completion before reporting a successful save.
                    };
                    req.onerror = () => reject(req.error);
                    tx.oncomplete = () => {
                        db.close();
                        if (broadcast && SYNC_CHANNEL) {
                            try { SYNC_CHANNEL.postMessage({ key, value }); }
                            catch (error) { console.warn('Broadcast sinkronisasi gagal:', error); }
                        }
                        resolve();
                    };
                    tx.onerror = () => { db.close(); reject(tx.error || req.error); };
                    tx.onabort = () => { db.close(); reject(tx.error || new Error('Transaksi database dibatalkan')); };
                });
            } catch (error) {

        // Web Audio API Sound Generator for Order Call Notification
        const playOrderCallSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const playTone = (freq, startTime, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + startTime);
                    
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + startTime);
                    osc.stop(audioCtx.currentTime + startTime + duration);
                };

                playTone(587.33, 0, 0.4); // D5

        function calculateCRC16(str) {
            let crc = 0xFFFF;
            for (let c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (let i = 0; i < 8; i++) {
                    if (crc & 0x8000) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            let hex = (crc & 0xFFFF).toString(16).toUpperCase();
            while (hex.length < 4) hex = '0' + hex;
            return hex;
        }

        function generateDynamicQris(staticQrisString, amount) {
            if (!staticQrisString || typeof staticQrisString !== 'string') return '';
            let qris = staticQrisString.trim();
            if (qris.length < 10) return qris;

            if (qris.endsWith('6304') && qris.length >= 4) {
                qris = qris.slice(0, -4);
            } else {
                const idx63 = qris.lastIndexOf('6304');
                if (idx63 !== -1) {
                    qris = qris.slice(0, idx63);
                }
            }

            if (qris.includes('010211')) {
                qris = qris.replace('010211', '010212');
            } else if (!qris.includes('010212')) {
                qris = '000201010212' + qris.replace('000201', '');
            }

            let cleanQris = '';
            let i = 0;
            while (i < qris.length) {
                const tag = qris.slice(i, i + 2);
                const lenStr = qris.slice(i + 2, i + 4);
                const len = parseInt(lenStr, 10);
                if (isNaN(len)) {
                    cleanQris += qris.slice(i);
                    break;
                }
                const value = qris.slice(i + 4, i + 4 + len);
                if (tag !== '54') {
                    cleanQris += tag + lenStr + value;
                }
                i += 4 + len;
            }

            const amountStr = Math.round(amount).toString();
            const tag54Val = '54' + (amountStr.length < 10 ? '0' + amountStr.length : amountStr.length) + amountStr;

            const idx58 = cleanQris.indexOf('5802ID');
            const idx59 = cleanQris.indexOf('59');
            if (idx58 !== -1) {
                cleanQris = cleanQris.slice(0, idx58) + tag54Val + cleanQris.slice(idx58);
            } else if (idx59 !== -1) {
                cleanQris = cleanQris.slice(0, idx59) + tag54Val + cleanQris.slice(idx59);
            } else {
                cleanQris += tag54Val;
            }

            cleanQris += '6304';
            const crcVal = calculateCRC16(cleanQris);
            return cleanQris + crcVal;
        }

            } catch (err) {
                console.warn("Clipboard API failed, using fallback", err);

                textarea.focus();

                    try {
                        const dbSettings = await dbGet('settings');
                        if (dbSettings) setSettings(dbSettings);

                        const dbPayments = await dbGet('paymentMethods');
                        if (dbPayments) setPaymentMethods(dbPayments);

                        const dbMenu = await dbGet('menuItems');
                        if (dbMenu) setMenuItems(dbMenu);

                        const dbOrders = await dbGet('orders');
                        if (dbOrders) setOrders(dbOrders);

                        const dbTables = await dbGet('tables');
                        if (dbTables) setTables(dbTables);

                        const dbStaff = await dbGet('staffUsers');
                        if (dbStaff) setStaffUsers(dbStaff);

                        const dbCategories = await dbGet('categories');
                        if (dbCategories) setCategories(dbCategories);
                    } catch (err) {
                        console.error("Error loading IndexedDB data:", err);
                    } finally {
                        setIsLoadingDB(false);
                    }
                };

                loadAllDataFromDB();

                const urlParams = new URLSearchParams(window.location.search);
                const tableParam = urlParams.get('table');
                if (tableParam) {
                    setCustomerTable(tableParam);
                    setView('customer');
                    window.history.pushState({}, '', window.location.pathname);
                }

                const handleSyncMessage = (event) => {
                    const message = event.data;
                    if (!message || typeof message.key !== 'string') return;
                    const { key, value } = message;
                    if (key === 'orders' && Array.isArray(value)) setOrders(value);
                    if (key === 'menuItems' && Array.isArray(value)) setMenuItems(value);
                    if (key === 'settings' && value && typeof value === 'object' && !Array.isArray(value)) setSettings(value);
                    if (key === 'paymentMethods' && Array.isArray(value)) setPaymentMethods(value);
                    if (key === 'tables' && Array.isArray(value)) setTables(value);
                    if (key === 'staffUsers' && Array.isArray(value)) setStaffUsers(value);
                    if (key === 'categories' && Array.isArray(value)) setCategories(value);
                };
                if (SYNC_CHANNEL) SYNC_CHANNEL.onmessage = handleSyncMessage;

                return () => {
                    window.removeEventListener('offline', handleOffline);
                    window.removeEventListener('online', handleOnline);
                    if (SYNC_CHANNEL) SYNC_CHANNEL.onmessage = null;
                };
            }, []);

            useEffect(() => { if (!isLoadingDB) dbSet('settings', settings, true); }, [settings, isLoadingDB]);
            useEffect(() => { if (!isLoadingDB) dbSet('paymentMethods', paymentMethods, true); }, [paymentMethods, isLoadingDB]);
            useEffect(() => { if (!isLoadingDB) dbSet('menuItems', menuItems, true); }, [menuItems, isLoadingDB]);
            useEffect(() => { if (!isLoadingDB) dbSet('orders', orders, true); }, [orders, isLoadingDB]);
            useEffect(() => { if (!isLoadingDB) dbSet('tables', tables, true); }, [tables, isLoadingDB]);
            useEffect(() => { if (!isLoadingDB) dbSet('staffUsers', staffUsers, true); }, [staffUsers, isLoadingDB]);
            useEffect(() => { if (!isLoadingDB) dbSet('categories', categories, true); }, [categories, isLoadingDB]);

            useEffect(() => {
                if (!isCloudReady || isLoadingDB || isCloudSyncingRef.current) return;
                syncAllDataToCloud({
                    settings,
                    paymentMethods,
                    menuItems,
                    categories,
                    orders,
                    staffUsers,
                    tables
                });
            }, [settings, paymentMethods, menuItems, categories, orders, staffUsers, tables, isCloudReady, isLoadingDB]);

            useEffect(() => {
                if (settings.appBackground) {
                    const bg = settings.appBackground.trim();
                    if (bg.startsWith('http') || bg.startsWith('data:image')) {
                        document.body.style.backgroundImage = `url('${bg}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                        document.body.style.backgroundAttachment = 'fixed';
                        document.body.style.backgroundColor = '#f4f4f5';
                    } else {
                        document.body.style.backgroundColor = bg || '#f4f4f5';
                        document.body.style.backgroundImage = 'none';
                    }
                }
            }, [settings.appBackground]);

            const generateOrderId = () => {
                const prefix = (settings.orderPrefix || 'ORD').trim().toUpperCase() || 'ORD';
                for (let attempt = 0; attempt < 30; attempt++) {
                    const candidate = `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
                    if (!orders.some(order => order.id === candidate)) return candidate;
                }
                return `${prefix}-${Date.now().toString().slice(-8)}`;
            };

            const calculateSubtotal = (cart) => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const calculateTax = (subtotal) => subtotal * (settings.taxRate / 100);
            const calculateService = (subtotal) => subtotal * (settings.serviceCharge / 100);
            const calculateTotal = (cart) => {
                const sub = calculateSubtotal(cart);
                return sub + calculateTax(sub) + calculateService(sub);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                const found = staffUsers.find(u => u.username === loginForm.username && u.pin === loginForm.pin);
                if (found) {
                    setCurrentUser(found);
                    setView('admin');
                    setAdminTab('pos');
                    setLoginForm({ username: '', pin: '' });
                } else {
                    showCustomAlert('Gagal Masuk', 'Username atau PIN 6-digit salah. Silakan coba lagi.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('landing');
            };

            const handleCustomerLogin = (e) => {
                e.preventDefault();
                if (customerTable.trim() || customerOrderType === 'takeaway') setView('customer');
            };

            const addToCustomerCart = (item) => {
                setCustomerCart(prev => {
                    const exists = prev.find(i => i.id === item.id);
                    if (exists) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                    return [...prev, { ...item, quantity: 1 }];
                });
            };

            const updateCustomerQuantity = (id, delta) => {
                setCustomerCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const handleCustomerCheckout = () => {
                if (!customerName.trim()) {
                    showCustomAlert('Nama Diperlukan', 'Mohon masukkan nama pemesan sebelum mengirim pesanan.');
                    return;
                }
                if (!checkoutData.paymentMethod || customerCart.length === 0) return;
                
                const newOrder = {
                    id: generateOrderId(),
                    customerName: customerName.trim(),
                    table: customerOrderType === 'takeaway' ? 'Takeaway' : customerTable,
                    orderType: customerOrderType,
                    items: [...customerCart],
                    subtotal: calculateSubtotal(customerCart),
                    tax: calculateTax(calculateSubtotal(customerCart)),
                    service: calculateService(calculateSubtotal(customerCart)),
                    total: calculateTotal(customerCart),
                    paymentMethod: checkoutData.paymentMethod,
                    notes: checkoutData.notes,
                    status: 'unverified', 
                    time: new Date().toISOString(),
                    source: 'QR',
                    cashGiven: 0,
                    changeAmount: 0
                };
                
                setOrders(prev => [newOrder, ...prev]);
                setActiveOrder(newOrder);
                setReceiptOrder(newOrder); 
                setCustomerCart([]);
                setShowCart(false);
            };

            const addToPosCart = (item) => {
                setPosCart(prev => {
                    const exists = prev.find(i => i.id === item.id);
                    if (exists) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                    return [...prev, { ...item, quantity: 1 }];
                });
            };

            const updatePosQuantity = (id, delta) => {
                setPosCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const handlePosCheckout = () => {
                if (!posPaymentMethod || posCart.length === 0) return;
                const totalAmt = calculateTotal(posCart);
                const selectedPm = paymentMethods.find(p => p.id === posPaymentMethod);
                const isCash = selectedPm?.type === 'cash';

                let cashGivenNum = 0;
                let changeNum = 0;

                if (isCash) {
                    cashGivenNum = parseIndonesianNumber(posCashGiven);
                    if (cashGivenNum < totalAmt) {
                        showCustomAlert('Pembayaran Kurang', 'Jumlah uang tunai yang diterima kurang dari total tagihan.');
                        return;
                    }
                    changeNum = cashGivenNum - totalAmt;
                }

                const newOrder = {
                    id: generateOrderId(),
                    customerName: posCustomerName.trim() || 'Kasir / Walk-in',
                    table: posTableNo || 'Takeaway',
                    orderType: posOrderType,
                    items: [...posCart],
                    subtotal: calculateSubtotal(posCart),
                    tax: calculateTax(calculateSubtotal(posCart)),
                    service: calculateService(calculateSubtotal(posCart)),
                    total: totalAmt,
                    paymentMethod: posPaymentMethod,
                    notes: '',
                    status: 'completed',
                    time: new Date().toISOString(),
                    source: 'KASIR',
                    cashGiven: isCash ? cashGivenNum : 0,
                    changeAmount: isCash ? changeNum : 0
                };
                
                setOrders(prev => [newOrder, ...prev]);
                setPosCart([]);
                setPosTableNo('');
                setPosCustomerName('');
                setPosPaymentMethod('');
                setPosCashGiven('');
                setReceiptOrder(newOrder);
            };
            
            const updateOrderStatus = (orderId, newStatus) => {
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
            };

            const saveMenu = (e) => {
                e.preventDefault();
                if (editingMenu) {
                    setMenuItems(menuItems.map(m => m.id === editingMenu.id ? { ...menuForm, id: m.id, price: Number(menuForm.price) } : m));
                } else {
                    setMenuItems([...menuItems, { ...menuForm, id: Date.now(), price: Number(menuForm.price) }]);
                }
                setShowMenuModal(false);
            };

            const deleteMenu = (id) => {
                showCustomAlert('Hapus Menu', 'Apakah Anda yakin ingin menghapus menu ini?', () => {
                    setMenuItems(menuItems.filter(m => m.id !== id));
                });
            };

            const openMenuModal = (menu = null) => {
                if (menu) {
                    setEditingMenu(menu);
                    setMenuForm(menu);
                } else {
                    setEditingMenu(null);
                    setMenuForm({ name: '', price: '', category: categories.filter(c => c.id !== 'Semua')[0]?.id || 'Makanan Utama', image: '', description: '' });
                }
                setShowMenuModal(true);
            };

            // Excel Export & Import for Menu
            const exportMenuToXLSX = () => {
                const dataToExport = menuItems.map(m => ({
                    ID: m.id,
                    Nama_Menu: m.name,
                    Harga: m.price,
                    Kategori: m.category,
                    Deskripsi: m.description,
                    URL_Gambar: m.image
                }));

                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Katalog Menu");
                XLSX.writeFile(workbook, `Katalog-Menu-RestoQR-${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            const importMenuFromXLSX = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet);

                        if (json && json.length > 0) {
                            const importedMenu = json.map((row, idx) => ({
                                id: Number(row.ID) || Date.now() + idx,
                                name: row.Nama_Menu || row.name || 'Menu Baru',
                                price: Number(row.Harga || row.price) || 0,
                                category: row.Kategori || row.category || 'Makanan Utama',
                                description: row.Deskripsi || row.description || '',
                                image: row.URL_Gambar || row.image || 'https://placehold.co/400x400/aa1c22/ffffff?text=Menu'
                            }));

                            setMenuItems(importedMenu);
                            showCustomAlert('Berhasil', `Berhasil mengimpor ${importedMenu.length} menu dari file Excel!`);
                        } else {
                            showCustomAlert('Gagal', 'File Excel kosong atau format tidak sesuai.');
                        }
                    } catch (err) {
                        console.error(err);
                        showCustomAlert('Gagal', 'Terjadi kesalahan saat membaca file Excel.');
                    }
                    e.target.value = '';
                };
                reader.readAsArrayBuffer(file);
            };

            const saveStaff = (e) => {
                e.preventDefault();
                const username = String(staffForm.username || '').trim();
                const pin = String(staffForm.pin || '');
                if (!username) {
                    showCustomAlert('Data Tidak Valid', 'Username wajib diisi.');
                    return;
                }
                if (!/^\d{6}$/.test(pin)) {
                    showCustomAlert('PIN Tidak Valid', 'PIN harus terdiri dari tepat 6 angka.');
                    return;
                }
                if (staffUsers.some(s => String(s.username || '').toLowerCase() === username.toLowerCase() && s.id !== editingStaff?.id)) {
                    showCustomAlert('Username Sudah Digunakan', 'Gunakan username yang berbeda untuk setiap akun staff.');
                    return;
                }
                const normalizedStaffForm = { ...staffForm, username, pin };
                if (editingStaff) {
                    setStaffUsers(staffUsers.map(s => s.id === editingStaff.id ? { ...normalizedStaffForm, id: s.id } : s));
                } else {
                    setStaffUsers([...staffUsers, { ...normalizedStaffForm, id: Date.now() }]);
                }
                setShowStaffModal(false);
            };

            const deleteStaff = (id) => {
                if (staffUsers.length <= 1) {
                    showCustomAlert('Peringatan', 'Restoran harus memiliki setidaknya 1 akun staff.');
                    return;
                }
                showCustomAlert('Hapus Staff', 'Apakah Anda yakin ingin menghapus akun staff ini?', () => {
                    setStaffUsers(staffUsers.filter(s => s.id !== id));
                });
            };

            const openStaffModal = (staff = null) => {
                if (staff) {
                    setEditingStaff(staff);
                    setStaffForm(staff);
                } else {
                    setEditingStaff(null);
                    setStaffForm({ username: '', pin: '', name: '', role: 'cashier' });
                }
                setShowStaffModal(true);
            };

            const savePayment = (e) => {
                e.preventDefault();
                if (editingPayment) {
                    setPaymentMethods(paymentMethods.map(p => p.id === editingPayment.id ? { ...p, ...paymentForm } : p));
                } else {
                    const newId = `pay_${Date.now()}`;
                    setPaymentMethods([...paymentMethods, { id: newId, ...paymentForm }]);
                }
                setShowPaymentModal(false);
            };

            const deletePayment = (id) => {
                if (paymentMethods.length <= 1) {
                    showCustomAlert('Peringatan', 'Restoran harus memiliki setidaknya 1 metode pembayaran.');
                    return;
                }
                showCustomAlert('Hapus Metode', 'Apakah Anda yakin ingin menghapus metode pembayaran ini?', () => {
                    setPaymentMethods(paymentMethods.filter(p => p.id !== id));
                });
            };

            const openPaymentModal = (pm = null) => {
                if (pm) {
                    setEditingPayment(pm);
                    setPaymentForm(pm);
                } else {
                    setEditingPayment(null);
                    setPaymentForm({ name: '', type: 'transfer', isActive: true, instructions: '' });
                }
                setShowPaymentModal(true);
            };

            const addTable = () => {
                const name = prompt('Masukkan Nomor/Nama Meja baru:');
                if (name) {
                    const id = `T${Date.now()}`;
                    const link = `${window.location.origin}${window.location.pathname}?table=${encodeURIComponent(name)}`;
                    setTables([...tables, { id, name, link }]);
                }
            };

            const deleteTable = (id) => {
                showCustomAlert('Hapus Meja', 'Apakah Anda yakin ingin menghapus meja ini?', () => {
                    setTables(tables.filter(t => t.id !== id));
                });
            };

            const addCategory = (e) => {
                e.preventDefault();
                if (!categoryForm.name.trim()) return;
                const newCatId = categoryForm.name.trim();
                if (categories.some(c => c.id === newCatId)) {
                    showCustomAlert('Peringatan', 'Kategori ini sudah ada.');
                    return;
                }
                setCategories([...categories, { id: newCatId, name: categoryForm.name.trim() }]);
                setCategoryForm({ name: '' });
                setShowCategoryModal(false);
            };

            const deleteCategory = (catId) => {
                if (catId === 'Semua') return;
                if (categories.length <= 2) {
                    showCustomAlert('Peringatan', 'Harus ada setidaknya 1 kategori menu selain "Semua".');
                    return;
                }
                showCustomAlert('Hapus Kategori', `Hapus kategori "${catId}"? Menu dalam kategori ini akan dipindahkan ke kategori pertama yang tersedia.`, () => {
                    const fallbackCat = categories.find(c => c.id !== 'Semua' && c.id !== catId)?.id || 'Makanan Utama';
                    setMenuItems(menuItems.map(m => m.category === catId ? { ...m, category: fallbackCat } : m));
                    setCategories(categories.filter(c => c.id !== catId));
                });
            };

            const getQrBase64Sync = (text, size = 150) => {
                return new Promise((resolve) => {
                    const tempDiv = document.createElement('div');
                    tempDiv.style.width = `${size}px`;
                    tempDiv.style.height = `${size}px`;
                    tempDiv.style.display = 'flex';
                    tempDiv.style.alignItems = 'center';
                    tempDiv.style.justifyContent = 'center';
                    tempDiv.style.padding = '0';
                    const qr = new QRCode(tempDiv, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: '#111827',
                        colorLight: '#FFFFFF',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    setTimeout(() => {
                        const canvas = tempDiv.querySelector('canvas');
                        resolve(canvas ? canvas.toDataURL('image/png') : '');
                    }, 50);
                });
            };

            const getPaymentMethodLabel = (methodId) => {
                const pm = paymentMethods.find(item => item.id === methodId);
                return pm ? pm.name : 'Metode Pembayaran';
            };

            const filteredMenu = useMemo(() => {
                if (customerActiveCat === 'Semua') return menuItems;
                return menuItems.filter(item => item.category === customerActiveCat);
            }, [menuItems, customerActiveCat]);

            const posFilteredMenu = useMemo(() => {
                if (posActiveCat === 'Semua') return menuItems;
                return menuItems.filter(item => item.category === posActiveCat);
            }, [menuItems, posActiveCat]);

            const activeOrders = useMemo(() => {
                return orders.filter(order => order.status !== 'completed');
            }, [orders]);

            const handleOrderComplete = (orderId) => {
                updateOrderStatus(orderId, 'completed');
                const order = orders.find(o => o.id === orderId);
                if (order && order.status !== 'completed') {
                    announceOrderCall(order.customerName, order.id, settings.soundEnabled, settings.voiceType);
                }
            };

            const renderLanding = () => (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="w-full max-w-6xl grid md:grid-cols-2 gap-8 items-center">
                        <div className="space-y-6">
                            <div className="inline-flex items-center rounded-full bg-brand-50 text-brand-700 px-4 py-2 text-sm font-semibold">
                                Resto QR Pro
                            </div>
                            <h1 className="text-4xl md:text-6xl font-black text-slate-900 leading-tight">
                                Pesan & Bayar <span className="text-brand-600">Lebih Cepat</span>
                            </h1>
                            <p className="text-lg text-slate-600">
                                Sistem pemesanan digital untuk restoran modern dengan QR menu, POS, dan pembayaran yang terintegrasi.
                            </p>
                            <div className="flex flex-wrap gap-4">
                                <button onClick={() => setView('customer')} className="bg-brand-600 text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-brand-500/20 hover:bg-brand-700 transition">
                                    Lanjutkan ke Menu
                                </button>
                                <button onClick={() => setView('login')} className="bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold hover:bg-slate-800 transition">
                                    Login Admin
                                </button>
                            </div>
                        </div>
                        <div className="glass-panel rounded-3xl p-6 shadow-xl border border-white/60">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-brand-50 rounded-2xl p-4">
                                    <div className="text-2xl font-black text-brand-700">{menuItems.length}</div>
                                    <div className="text-sm text-slate-600">Menu</div>
                                </div>
                                <div className="bg-emerald-50 rounded-2xl p-4">
                                    <div className="text-2xl font-black text-emerald-700">{orders.length}</div>
                                    <div className="text-sm text-slate-600">Pesanan</div>
                                </div>
                                <div className="bg-amber-50 rounded-2xl p-4">
                                    <div className="text-2xl font-black text-amber-700">{tables.length}</div>
                                    <div className="text-sm text-slate-600">Meja</div>
                                </div>
                                <div className="bg-sky-50 rounded-2xl p-4">
                                    <div className="text-2xl font-black text-sky-700">{paymentMethods.length}</div>
                                    <div className="text-sm text-slate-600">Pembayaran</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <>
                    {view === 'landing' && renderLanding()}
                    {view === 'login' && (
                        <div className="min-h-screen flex items-center justify-center bg-slate-100 p-6">
                            <div className="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">
                                <h2 className="text-2xl font-black text-slate-900 mb-6">Login Admin</h2>
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-2">Username</label>
                                        <input value={loginForm.username} onChange={e => setLoginForm({ ...loginForm, username: e.target.value })} className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="admin" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-2">PIN</label>
                                        <input type="password" value={loginForm.pin} onChange={e => setLoginForm({ ...loginForm, pin: e.target.value })} className="w-full border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="123456" />
                                    </div>
                                    <button type="submit" className="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold hover:bg-brand-700 transition">Masuk</button>
                                </form>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
